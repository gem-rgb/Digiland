# =============================================================================
# Digiland — Continuous Integration Pipeline
# =============================================================================
# Triggers: push to main/develop, pull requests to main/develop
# Jobs: lint → test → security-scan → build → deploy-staging → deploy-production
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: land_escrow.settings
  DB_ENGINE: django.db.backends.sqlite3

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # =========================================================================
  # 1. LINT
  # =========================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            land_escrow/config/requirements.txt
            requirements*.txt

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort flake8-django flake8-bugbear flake8-comprehensions

      - name: Run flake8
        run: |
          flake8 land_escrow/ \
            --max-line-length=120 \
            --exclude=migrations,staticfiles,*.pyc,__pycache__,node_modules \
            --max-complexity=12 \
            --count \
            --show-source \
            --statistics

      - name: Run black (check mode)
        run: |
          black land_escrow/ --check --line-length=120 \
            --exclude 'migrations|staticfiles|node_modules'

      - name: Run isort (check mode)
        run: |
          isort land_escrow/ --check-only --profile black \
            --skip-glob '*/migrations/*' \
            --skip-glob '*/staticfiles/*' \
            --skip-glob '*/node_modules/*'

  # =========================================================================
  # 2. TEST
  # =========================================================================
  test:
    name: Django Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: test-secret-key-ci-not-for-production
      DEBUG: "True"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      USE_REDIS_CACHE: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            land_escrow/config/requirements.txt
            requirements*.txt

      - name: Install dependencies
        working-directory: land_escrow
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt
          pip install coverage pytest-django pytest-cov

      - name: Run migrations check
        working-directory: land_escrow
        env:
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}
        run: |
          python manage.py check --deploy 2>&1 || true
          python manage.py makemigrations --check --dry-run

      - name: Run Django tests with coverage
        working-directory: land_escrow
        env:
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}
        run: |
          coverage run --source='.' manage.py test --verbosity=2 --parallel=4
          coverage report --fail-under=80
          coverage xml -o coverage.xml
          coverage html -d htmlcov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: land_escrow/htmlcov/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: land_escrow/coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # =========================================================================
  # 3. SECURITY SCAN
  # =========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            land_escrow/config/requirements.txt
            requirements*.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit

      - name: Run Bandit SAST
        run: |
          bandit -r land_escrow/ \
            -x land_escrow/staticfiles,land_escrow/*/migrations,land_escrow/client \
            -f json -o bandit-report.json \
            --severity-level medium \
            --confidence-level medium \
            || true
          bandit -r land_escrow/ \
            -x land_escrow/staticfiles,land_escrow/*/migrations,land_escrow/client \
            -f txt || true

      - name: Run Safety vulnerability check
        working-directory: land_escrow
        run: |
          safety check -r config/requirements.txt --output json > safety-report.json || true
          safety check -r config/requirements.txt --output text || true

      - name: Run pip-audit
        working-directory: land_escrow
        run: |
          pip-audit -r config/requirements.txt --format json > pip-audit-report.json || true
          pip-audit -r config/requirements.txt || true

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload security scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            bandit-report.json
            land_escrow/safety-report.json
            land_escrow/pip-audit-report.json
            trivy-results.sarif
          retention-days: 30

  # =========================================================================
  # 4. BUILD
  # =========================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./land_escrow
          file: ./land_escrow/config/Dockerfile.production
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

  # =========================================================================
  # 5. DEPLOY STAGING
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.digiland.co.ke
    permissions:
      contents: read
      packages: read
    env:
      KUBE_NAMESPACE: digiland-staging
      DEPLOYMENT_NAME: digiland-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to staging (rolling update)
        run: |
          # Set the image tag to the current SHA
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            web=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.KUBE_NAMESPACE }}

          # Wait for rollout to complete
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=300s

      - name: Run post-deploy health check
        run: |
          echo "Waiting for pods to be ready..."
          sleep 15

          STAGING_URL="https://staging.digiland.co.ke"

          # Health check with retries
          for i in $(seq 1 10); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${STAGING_URL}/api/v1/health/ || echo "000")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Health check PASSED (HTTP $HTTP_STATUS)"
              exit 0
            fi
            echo "Health check attempt $i failed (HTTP $HTTP_STATUS). Retrying in 10s..."
            sleep 10
          done

          echo "Health check FAILED after 10 attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back staging deployment..."
          kubectl rollout undo deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=120s
          echo "Rollback complete"

      - name: Notify Slack — Staging
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Staging Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rocket: *Staging Deployment ${{ job.status }}*\nCommit: `${{ github.sha }}`\nBranch: `${{ github.ref_name }}`\nActor: ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_STAGING }}
        continue-on-error: true

  # =========================================================================
  # 6. DEPLOY PRODUCTION
  # =========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://digiland.co.ke
    permissions:
      contents: read
      packages: read
    env:
      KUBE_NAMESPACE: digiland-production
      DEPLOYMENT_NAME: digiland-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Pre-deploy — Create database backup
        run: |
          kubectl exec -n ${{ env.KUBE_NAMESPACE }} deployment/digiland-db -- \
            pg_dump -U digiland digiland > backup_$(date +%Y%m%d_%H%M%S).sql
          echo "Database backup created"

      - name: Blue-Green Deploy — Create green deployment
        run: |
          # Copy current (blue) deployment to green with new image
          kubectl get deployment ${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.KUBE_NAMESPACE }} \
            -o json | \
            jq --arg IMG "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
               '.metadata.name = "${{ env.DEPLOYMENT_NAME }}-green" |
                .spec.template.spec.containers[0].image = $IMG' | \
            kubectl apply -f -

          # Wait for green pods to be ready
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }}-green \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=300s

      - name: Switch traffic to green
        run: |
          # Update the service selector to point to green
          kubectl patch service ${{ env.DEPMENT_NAME }}-service \
            -n ${{ env.KUBE_NAMESPACE }} \
            -p '{"spec":{"selector":{"app":"${{ env.DEPLOYMENT_NAME }}","version":"green"}}}'

          echo "Traffic switched to green deployment"

      - name: Run post-deploy health check
        run: |
          PROD_URL="https://digiland.co.ke"

          for i in $(seq 1 15); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${PROD_URL}/api/v1/health/ || echo "000")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "Production health check PASSED (HTTP $HTTP_STATUS)"
              exit 0
            fi
            echo "Health check attempt $i failed (HTTP $HTTP_STATUS). Retrying in 10s..."
            sleep 10
          done

          echo "Production health check FAILED"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "ROLLING BACK — Switching traffic back to blue..."
          kubectl patch service ${{ env.DEPLOYMENT_NAME }}-service \
            -n ${{ env.KUBE_NAMESPACE }} \
            -p '{"spec":{"selector":{"app":"${{ env.DEPLOYMENT_NAME }}","version":"blue"}}}'

          # Scale down green
          kubectl scale deployment/${{ env.DEPLOYMENT_NAME }}-green \
            --replicas=0 -n ${{ env.KUBE_NAMESPACE }}

          echo "Rollback complete. Traffic restored to blue."

      - name: Cleanup — Remove old blue deployment
        if: success()
        run: |
          # Remove the old deployment after successful switch
          kubectl delete deployment/${{ env.DEPLOYMENT_NAME }} \
            -n ${{ env.KUBE_NAMESPACE }} --ignore-not-found=true || true

          # Rename green to become the new blue
          kubectl label deployment/${{ env.DEPLOYMENT_NAME }}-green \
            version=blue --overwrite -n ${{ env.KUBE_NAMESPACE }} || true

          echo "Blue-Green deployment complete. Green is now the active deployment."

      - name: Notify Slack — Production
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": "Production Deployment ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":${{ job.status == 'success' && 'white_check_mark' || 'x' }}: *Production Deployment ${{ job.status }}*\nCommit: `${{ github.sha }}`\nBranch: `${{ github.ref_name }}`\nActor: ${{ github.actor }}\nStrategy: Blue-Green"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PRODUCTION }}
        continue-on-error: true
