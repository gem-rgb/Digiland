name: Deploy to Production

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Approval Gate ──────────────────────────────────────────────────────
  approve:
    name: Production Approval
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approve deployment
        run: echo "Production deployment approved for ${{ github.event.release.tag_name }}"

  # ─── Deploy ─────────────────────────────────────────────────────────────
  deploy:
    name: Blue-Green Production Deploy
    runs-on: ubuntu-latest
    needs: approve
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./land_escrow
          file: ./land_escrow/config/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy (Green)
        run: |
          helm upgrade --install digiland-green ./helm/digiland \
            --namespace digiland-production \
            --create-namespace \
            --values ./helm/digiland/values-production.yaml \
            --set image.tag=${{ github.event.release.tag_name }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set nameOverride=digiland-green \
            --wait --timeout=600s

      - name: Health check (Green)
        run: |
          GREEN_URL=${{ secrets.GREEN_URL }}
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$GREEN_URL/api/v1/health/" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Green deployment healthy"
              break
            fi
            echo "Waiting for green deployment... attempt $i/30"
            sleep 10
          done

          # Final health check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$GREEN_URL/api/v1/health/" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Green deployment health check failed"
            exit 1
          fi

      - name: Switch traffic (Blue → Green)
        run: |
          kubectl patch service digiland-production -n digiland-production \
            -p '{"spec":{"selector":{"app":"digiland-green"}}}'

      - name: Validate production
        run: |
          PROD_URL=${{ secrets.PRODUCTION_URL }}
          sleep 15

          # Check error rate
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/v1/health/" || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Production validation failed — rolling back"
            kubectl patch service digiland-production -n digiland-production \
              -p '{"spec":{"selector":{"app":"digiland-blue"}}}'
            exit 1
          fi
          echo "Production validation passed"

      - name: Cleanup old Blue
        if: success()
        run: |
          kubectl delete deployment digiland-blue -n digiland-production --ignore-not-found=true || true

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Rolling back to previous deployment..."
          kubectl patch service digiland-production -n digiland-production \
            -p '{"spec":{"selector":{"app":"digiland-blue"}}}' || true
          echo "Rollback initiated"

      - name: Notify deployment
        if: always()
        run: |
          echo "Production deployment for ${{ github.event.release.tag_name }} completed with status: ${{ job.status }}"
