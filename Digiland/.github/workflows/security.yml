# =============================================================================
# Digiland — Security Scanning Pipeline
# =============================================================================
# Runs daily at 06:00 UTC and on every push to main/develop.
# Performs: dependency scanning, SAST, container scanning, secret scanning,
#           SBOM generation, and uploads SARIF results to GitHub Security tab.
# =============================================================================

name: Security Scan

on:
  schedule:
    - cron: "0 6 * * *"   # Daily at 06:00 UTC
  push:
    branches: [main, develop]
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: read
  security-events: write
  actions: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # =========================================================================
  # 1. DEPENDENCY VULNERABILITY SCANNING
  # =========================================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            land_escrow/config/requirements.txt
            requirements*.txt

      - name: Install scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit

      - name: Run Safety vulnerability scan
        working-directory: land_escrow
        run: |
          echo "::group::Safety vulnerability report"
          safety check -r config/requirements.txt \
            --output json \
            --output safety-report.json \
            || true
          safety check -r config/requirements.txt --output text || true
          echo "::endgroup::"

      - name: Run pip-audit
        working-directory: land_escrow
        run: |
          echo "::group::pip-audit vulnerability report"
          pip-audit -r config/requirements.txt \
            --format json \
            --output pip-audit-report.json \
            || true
          pip-audit -r config/requirements.txt || true
          echo "::endgroup::"

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-scan-reports
          path: |
            land_escrow/safety-report.json
            land_escrow/pip-audit-report.json
          retention-days: 30

  # =========================================================================
  # 2. SAST — Static Application Security Testing
  # =========================================================================
  sast:
    name: SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r land_escrow/ \
            -x land_escrow/staticfiles,land_escrow/*/migrations,land_escrow/client,land_escrow/staticfiles \
            -f json -o bandit-report.json \
            -ll -ii \
            || true
          bandit -r land_escrow/ \
            -x land_escrow/staticfiles,land_escrow/*/migrations,land_escrow/client \
            -f txt \
            || true

      - name: Run Semgrep SAST scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/django
            p/owasp-top-ten
            p/jwt
            p/sql-injection
            p/xss
            p/command-injection
        continue-on-error: true

      - name: Upload Bandit SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-report.json
        continue-on-error: true

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-reports
          path: bandit-report.json
          retention-days: 30

  # =========================================================================
  # 3. CONTAINER SCANNING
  # =========================================================================
  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
        continue-on-error: true

      - name: Run Trivy config scanning (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy FS scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: trivy-filesystem
        continue-on-error: true

      - name: Upload Trivy config scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: trivy-config
        continue-on-error: true

      - name: Upload container scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-reports
          path: |
            trivy-fs-results.sarif
            trivy-config-results.sarif
          retention-days: 30

  # =========================================================================
  # 4. SECRET SCANNING
  # =========================================================================
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better detection

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Scan for secrets
        run: |
          detect-secrets scan --all-files \
            --exclude-files '\.secrets\.baseline' \
            --exclude-files 'node_modules/' \
            --exclude-files 'staticfiles/' \
            --exclude-files 'migrations/' \
            --exclude-files '\.git/' \
            > detect-secrets-report.json || true

          echo "::group::Detected secrets"
          detect-secrets scan --all-files 2>/dev/null | python -m json.tool || true
          echo "::endgroup::"

      - name: Check baseline for new secrets
        run: |
          if [ -f .secrets.baseline ]; then
            echo "Comparing against baseline..."
            detect-secrets scan --all-files > current-scan.json || true
            # Audit will show new secrets not in baseline
            echo "Secret audit complete"
          else
            echo "No baseline file found. Current scan saved as report."
          fi

      - name: Upload secret scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-reports
          path: detect-secrets-report.json
          retention-days: 7

  # =========================================================================
  # 5. SBOM GENERATION
  # =========================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install cyclonedx-py
        run: pip install cyclonedx-bom

      - name: Generate Python SBOM (CycloneDX)
        working-directory: land_escrow
        run: |
          cyclonedx-py requirements \
            -i config/requirements.txt \
            -o sbom-python.json \
            --format json
          echo "Python SBOM generated: sbom-python.json"

      - name: Generate filesystem SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: .
          format: cyclonedx-json
          output-file: sbom-filesystem.json
        continue-on-error: true

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            land_escrow/sbom-python.json
            sbom-filesystem.json
          retention-days: 90

  # =========================================================================
  # 6. SECURITY SUMMARY
  # =========================================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, sast, container-scan, secret-scan, sbom]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Vulnerabilities | ${{ needs.dependency-scan.result == 'success' && ':white_check_mark: Pass' || ':x: Review Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Bandit + Semgrep) | ${{ needs.sast.result == 'success' && ':white_check_mark: Pass' || ':x: Review Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container (Trivy) | ${{ needs.container-scan.result == 'success' && ':white_check_mark: Pass' || ':x: Review Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secret-scan.result == 'success' && ':white_check_mark: Pass' || ':x: Review Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generated | ${{ needs.sbom.result == 'success' && ':white_check_mark: Pass' || ':x: Review Required' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Scan completed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')_" >> $GITHUB_STEP_SUMMARY

      - name: Notify Slack on failure
        if: |
          needs.dependency-scan.result == 'failure' ||
          needs.sast.result == 'failure' ||
          needs.secret-scan.result == 'failure'
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": ":rotating_light: Security scan detected issues in Digiland!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Security Scan Alert*\nBranch: `${{ github.ref_name }}`\nCommit: `${{ github.sha }}`\n\nOne or more security scans require attention. Check the GitHub Security tab for details."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_SECURITY }}
        continue-on-error: true
