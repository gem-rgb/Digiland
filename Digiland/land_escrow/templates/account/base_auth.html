{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Digiland{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'react/styles.css' %}">
  <style>
    body { font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col" style="background:radial-gradient(circle at top left,rgba(16,185,129,.16),transparent 28%),radial-gradient(circle at top right,rgba(5,150,105,.08),transparent 24%),linear-gradient(180deg,#fcfbf8,#f4efe7)">
    <!-- Header -->
    <header class="sticky top-0 z-30 border-b border-border/70 bg-white/80 backdrop-blur-xl">
      <div class="mx-auto flex w-full max-w-7xl items-center gap-4 px-4 py-3 sm:px-6 lg:px-8">
        <a href="/" class="flex items-center gap-3 rounded-full px-1 py-1 transition hover:opacity-90">
          <span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-primary text-primary-foreground shadow-soft">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <div class="leading-tight">
            <div class="text-base font-extrabold tracking-tight text-foreground">Digiland</div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.22em] text-muted-foreground">Land escrow</div>
          </div>
        </a>
        {% block header_nav %}
        <div class="ml-auto flex items-center gap-3">
          <a href="{% url 'account_login' %}" class="inline-flex h-10 items-center justify-center rounded-full border border-border bg-white/80 px-5 text-sm font-semibold text-foreground transition-colors hover:bg-muted">Sign in</a>
          <a href="{% url 'account_signup' %}" class="inline-flex h-10 items-center justify-center rounded-full bg-primary px-5 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90">Create account</a>
        </div>
        {% endblock %}
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
      <div class="w-full max-w-md">
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-border/60 bg-white/80 backdrop-blur-xl py-5">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-3">
        <div class="text-[11px] text-muted-foreground">&copy; 2026 Digiland</div>
        <div class="flex items-center gap-4 text-[11px] text-muted-foreground">
          <a href="/escrow-acts/" class="hover:text-emerald-700 transition-colors">Legal</a>
          <a href="/parcels/" class="hover:text-emerald-700 transition-colors">Marketplace</a>
        </div>
      </div>
    </footer>
  </div>
  <div id="oauth-loading-overlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/25 px-4 py-6 backdrop-blur-sm">
    <div class="w-full max-w-sm rounded-[1.75rem] border border-border/70 bg-white/95 p-5 shadow-2xl">
      <div class="flex items-center gap-3">
        <span class="flex h-11 w-11 items-center justify-center rounded-2xl bg-emerald-50 text-emerald-700">
          <span class="h-5 w-5 animate-spin rounded-full border-2 border-current border-t-transparent"></span>
        </span>
        <div>
          <div class="text-sm font-bold text-foreground" data-oauth-loading-title>Signing you in...</div>
          <div class="text-[11px] text-muted-foreground" data-oauth-loading-message>Opening your provider.</div>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function() {
    const overlay = document.getElementById('oauth-loading-overlay');
    if (!overlay) return;

    const titleNode = overlay.querySelector('[data-oauth-loading-title]');
    const messageNode = overlay.querySelector('[data-oauth-loading-message]');

    function showOverlay(title, message) {
      if (titleNode) {
        titleNode.textContent = title || 'Signing you in...';
      }
      if (messageNode) {
        messageNode.textContent = message || 'Opening your provider.';
      }
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    function setBusyState(element, label) {
      if (!element || element.dataset.busy === 'true') {
        return false;
      }

      element.dataset.busy = 'true';
      element.setAttribute('aria-busy', 'true');
      element.setAttribute('aria-disabled', 'true');
      element.classList.add('pointer-events-none', 'opacity-80');

      if (element.tagName === 'A') {
        element.setAttribute('tabindex', '-1');
      } else if (element.tagName === 'BUTTON') {
        element.disabled = true;
      }

      element.innerHTML = '';
      const wrapper = document.createElement('span');
      wrapper.className = 'inline-flex items-center gap-2';
      const spinner = document.createElement('span');
      spinner.className = 'h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent';
      const text = document.createElement('span');
      text.textContent = label || 'Signing you in...';
      wrapper.append(spinner, text);
      element.appendChild(wrapper);
      return true;
    }

    document.querySelectorAll('[data-oauth-link]').forEach((link) => {
      link.addEventListener('click', (event) => {
        if (link.dataset.busy === 'true') {
          event.preventDefault();
          return;
        }

        event.preventDefault();
        const loadingLabel = link.dataset.loadingLabel || 'Signing you in...';
        const loadingMessage = link.dataset.loadingMessage || 'Opening your provider.';
        setBusyState(link, loadingLabel);
        showOverlay(loadingLabel, loadingMessage);

        const href = link.href;
        window.setTimeout(() => {
          window.location.href = href;
        }, 80);
      });
    });

    document.querySelectorAll('form[data-oauth-confirm-form]').forEach((form) => {
      form.addEventListener('submit', () => {
        if (form.dataset.busy === 'true') {
          return;
        }

        form.dataset.busy = 'true';
        const button = form.querySelector('button[type="submit"]');
        const loadingLabel = (button && button.dataset.loadingLabel) || 'Signing you in...';
        const loadingMessage = form.dataset.loadingMessage || 'Finalizing your sign in.';
        if (button) {
          setBusyState(button, loadingLabel);
        }
        showOverlay(loadingLabel, loadingMessage);
      });
    });
  })();
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
