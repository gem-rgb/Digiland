{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Sign Out - Digiland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'react/styles.css' %}">
  <style>
    body { font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col" style="background:radial-gradient(circle at top left,rgba(16,185,129,.16),transparent 28%),radial-gradient(circle at top right,rgba(2,132,199,.08),transparent 24%),linear-gradient(180deg,#fcfbf8,#f4efe7)">
    <!-- Header -->
    <header class="sticky top-0 z-30 border-b border-border/70 bg-white/80 backdrop-blur-xl">
      <div class="mx-auto flex w-full max-w-7xl items-center gap-4 px-4 py-3 sm:px-6 lg:px-8">
        <a href="/" class="flex items-center gap-3 rounded-full px-1 py-1 transition hover:opacity-90">
          <span class="flex h-10 w-10 items-center justify-center rounded-2xl bg-primary text-primary-foreground shadow-soft">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
          </span>
          <div class="leading-tight">
            <div class="text-base font-extrabold tracking-tight text-foreground">Digiland</div>
            <div class="text-[10px] font-semibold uppercase tracking-[0.22em] text-muted-foreground">Land escrow</div>
          </div>
        </a>
        <div class="ml-auto flex items-center gap-3">
          <a href="{% url 'account_login' %}" class="inline-flex h-10 items-center justify-center rounded-full border border-border bg-white/80 px-5 text-sm font-semibold text-foreground transition-colors hover:bg-muted">Sign in</a>
          <a href="{% url 'account_signup' %}" class="inline-flex h-10 items-center justify-center rounded-full bg-primary px-5 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90">Create account</a>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
      <div style="width:100%;max-width:400px">
        <div class="text-center mb-6">
          <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-emerald-50 border border-emerald-200/60">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          </div>
          <div class="text-[10px] font-bold uppercase tracking-[0.28em] text-emerald-700 mb-2">Session ended</div>
          <h1 class="text-2xl font-black tracking-tight text-foreground">Sign Out</h1>
          <p class="text-sm text-muted-foreground mt-1">Are you sure you want to sign out?</p>
        </div>

        <div class="rounded-3xl border border-border/70 bg-white/92 p-6 shadow-soft">
          <form method="post" action="{% url 'account_logout' %}" class="space-y-4">
            {% csrf_token %}
            {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
            {% endif %}

            <button type="submit" class="inline-flex h-10 w-full items-center justify-center rounded-full bg-primary px-5 text-sm font-semibold text-primary-foreground transition-colors hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2">
              Confirm Sign Out
            </button>
          </form>

          <div class="text-center border-t border-border/70 pt-4 mt-5">
            <a href="/" class="text-xs font-semibold text-muted-foreground hover:text-emerald-700 transition-colors">Cancel and go back</a>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-border/60 bg-white/80 backdrop-blur-xl py-5">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 flex items-center justify-between gap-3">
        <div class="text-[11px] text-muted-foreground">&copy; 2026 Digiland</div>
        <div class="flex items-center gap-4 text-[11px] text-muted-foreground">
          <a href="/escrow-acts/" class="hover:text-emerald-700 transition-colors">Legal</a>
          <a href="/parcels/" class="hover:text-emerald-700 transition-colors">Marketplace</a>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
