<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) - Digiland</title>
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Manrope', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="max-w-2xl w-full text-center space-y-8 py-12 px-6 rounded-[2.5rem] border border-emerald-500/20 bg-slate-900/80 shadow-2xl relative overflow-hidden backdrop-blur-xl">
    <!-- Glow Effects -->
    <div class="absolute -top-24 -left-24 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-64 h-64 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Icon -->
    <div class="relative z-10 flex justify-center">
      <div class="w-20 h-20 rounded-3xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shadow-lg shadow-emerald-500/10">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
        </svg>
      </div>
    </div>

    <!-- Content -->
    <div class="relative z-10 space-y-3">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-bold uppercase tracking-wider">
        Error 404
      </div>
      <h1 class="text-3xl sm:text-5xl font-black tracking-tight text-white">
        Looking for a parcel?
      </h1>
      <p class="text-sm sm:text-base text-slate-300 max-w-lg mx-auto leading-relaxed">
        The page or listing you are trying to reach doesn't exist or may have been moved.
      </p>
    </div>

    <!-- Search Form -->
    <form action="/parcels/" method="get" class="relative z-10 max-w-md mx-auto flex gap-2 p-1.5 rounded-2xl bg-white/5 border border-white/10 focus-within:border-emerald-500/50 transition">
      <input type="text" name="q" placeholder="Search county, ward, or parcel number..." class="flex-1 bg-transparent px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none">
      <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition flex items-center gap-2 shrink-0">
        Search
      </button>
    </form>

    <!-- Navigation Buttons -->
    <div class="relative z-10 pt-4 flex flex-wrap justify-center gap-3">
      <a href="/parcels/" class="inline-flex items-center justify-center h-12 px-6 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-emerald-500/20">
        Browse Marketplace
      </a>
      <a href="/" class="inline-flex items-center justify-center h-12 px-6 rounded-full border border-white/20 bg-white/5 hover:bg-white/10 text-white font-bold text-sm transition">
        Return Home
      </a>
      <a href="/support/" class="inline-flex items-center justify-center h-12 px-6 rounded-full border border-white/20 bg-white/5 hover:bg-white/10 text-slate-300 font-bold text-sm transition">
        Contact Support
      </a>
    </div>

    <!-- Quick Links -->
    <div class="relative z-10 pt-4 border-t border-white/10 flex flex-wrap justify-center items-center gap-4 text-xs text-slate-400">
      <span>Popular Locations:</span>
      <a href="/parcels/?q=Nairobi" class="hover:text-emerald-400 transition">Nairobi</a>
      <span>•</span>
      <a href="/parcels/?q=Nakuru" class="hover:text-emerald-400 transition">Nakuru</a>
      <span>•</span>
      <a href="/parcels/?q=Kiambu" class="hover:text-emerald-400 transition">Kiambu</a>
      <span>•</span>
      <a href="/parcels/?q=Kajiado" class="hover:text-emerald-400 transition">Kajiado</a>
    </div>
  </div>
</body>
</html>
