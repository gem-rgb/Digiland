<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Verification Session - DigiLand</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08);
    }
    .icon {
      width: 56px;
      height: 56px;
      background: #ecfdf5;
      color: #059669;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
      color: #0f172a;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      margin: 0 0 1.75rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: #059669;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 700;
      border-radius: 1rem;
      text-decoration: none;
      transition: background 0.15s ease;
      box-sizing: border-box;
    }
    .btn:hover {
      background: #047857;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <h1>Session Refreshed</h1>
    <p>Your secure session token was updated. Please return to the login screen to sign into your workspace.</p>
    <a href="/" class="btn">Return to Sign In →</a>
  </div>
</body>
</html>
