# =============================================================================
# Digiland - Nginx Reverse Proxy Configuration (Production-Ready)
# =============================================================================
# This config expects:
#   - Django web service on upstream "django" (port 8000)
#   - Static files at /usr/share/nginx/static
#   - Media files at /usr/share/nginx/media
#   - SSL certs at /etc/nginx/ssl/
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ---------------------------------------------------------------------------
    # Basic Settings
    # ---------------------------------------------------------------------------
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ---------------------------------------------------------------------------
    # Logging Format (includes request ID for correlation)
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time request_id=$request_id';

    access_log /var/log/nginx/access.log main;

    # ---------------------------------------------------------------------------
    # Gzip Compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ---------------------------------------------------------------------------
    # Upstream Django Application
    # ---------------------------------------------------------------------------
    upstream django {
        server web:8000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # Rate Limiting Zones
    # ---------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ===========================================================================
    # HTTP Server — Redirects ALL traffic to HTTPS
    # ===========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Health check endpoint (must be accessible over HTTP for load balancers)
        location /health/ {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Redirect all other HTTP traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===========================================================================
    # HTTPS Server (Production)
    # ===========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # --- SSL Certificates ---
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # --- SSL Session ---
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # --- Modern TLS (Mozilla Intermediate) ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # --- OCSP Stapling ---
        ssl_stapling on;
        ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
        resolver 8.8.8.8 8.8.4.4 valid=300s;

        # --- HSTS (1 year, include subdomains, preload) ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # --- Security Headers (aligned with Django middleware) ---
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(self), usb=()" always;
        # SECURITY: CSP without unsafe-inline/unsafe-eval — uses nonce approach
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://*.cloudinary.com; connect-src 'self' https://api.paystack.co https://api.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # -------------------------------------------------------------------
        # Static Files (served directly by Nginx)
        # -------------------------------------------------------------------
        location /static/ {
            alias /usr/share/nginx/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;

            # Serve pre-compressed files if available
            gzip_static on;

            # Block attempts to execute scripts in static
            location ~* \.(php|pl|py|sh|cgi|rb)$ {
                deny all;
            }
        }

        # -------------------------------------------------------------------
        # Media Files (served directly by Nginx)
        # -------------------------------------------------------------------
        location /media/ {
            alias /usr/share/nginx/media/;
            expires 7d;
            add_header Cache-Control "public";

            # Prevent execution of uploaded scripts
            location ~* \.(php|pl|py|sh|cgi|rb)$ {
                deny all;
            }
        }

        # -------------------------------------------------------------------
        # Favicon & Robots
        # -------------------------------------------------------------------
        location = /favicon.ico {
            alias /usr/share/nginx/static/favicon.ico;
            access_log off;
            log_not_found off;
            expires 30d;
        }

        location = /robots.txt {
            alias /usr/share/nginx/static/robots.txt;
            access_log off;
            log_not_found off;
            expires 7d;
        }

        # -------------------------------------------------------------------
        # API Endpoints (rate limited)
        # -------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
        }

        # -------------------------------------------------------------------
        # Authentication Endpoints (strictly rate limited)
        # -------------------------------------------------------------------
        location /accounts/ {
            limit_req zone=auth_limit burst=3 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        # -------------------------------------------------------------------
        # WebSocket Support (for future real-time features)
        # -------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://django;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Extended timeouts for WebSocket connections
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Disable buffering for real-time data
            proxy_buffering off;
        }

        # -------------------------------------------------------------------
        # Django Admin (restricted access)
        # -------------------------------------------------------------------
        location /admin/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        # -------------------------------------------------------------------
        # All Other Requests -> Django
        # -------------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=40 nodelay;
            limit_conn conn_limit 30;

            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;

            # Keepalive to upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # -------------------------------------------------------------------
        # Deny access to hidden files
        # -------------------------------------------------------------------
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
