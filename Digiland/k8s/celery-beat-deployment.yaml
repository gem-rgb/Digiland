apiVersion: apps/v1
kind: Deployment
metadata:
  name: digiland-celery-beat
  namespace: digiland
  labels:
    app: digiland
    component: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: digiland
      component: celery-beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: digiland
        component: celery-beat
    spec:
      serviceAccountName: digiland-serviceaccount
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: celery-beat
          image: ghcr.io/digiland/digiland:latest
          imagePullPolicy: Always
          command: ['celery']
          args:
            - -A
            - land_escrow
            - beat
            - --loglevel=info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - configMapRef:
                name: digiland-config
            - secretRef:
                name: digiland-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 60
