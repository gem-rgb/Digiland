apiVersion: apps/v1
kind: Deployment
metadata:
  name: digiland-web
  namespace: digiland
  labels:
    app: digiland
    component: web
    version: v1
spec:
  replicas: 4
  selector:
    matchLabels:
      app: digiland
      component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: digiland
        component: web
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: digiland-serviceaccount
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ['sh', '-c', 'until pg_isready -h $(POSTGRES_HOST) -p $(POSTGRES_PORT) -U $(POSTGRES_USER); do echo "Waiting for database..."; sleep 2; done;']
          envFrom:
            - configMapRef:
                name: digiland-config
        - name: wait-for-redis
          image: redis:7-alpine
          command: ['sh', '-c', 'until redis-cli -h $(REDIS_HOST) -p $(REDIS_PORT) -a $(REDIS_PASSWORD) ping; do echo "Waiting for Redis..."; sleep 2; done;']
          envFrom:
            - configMapRef:
                name: digiland-config
            - secretRef:
                name: digiland-secrets
        - name: migrate
          image: ghcr.io/digiland/digiland:latest
          command: ['python', 'manage.py', 'migrate', '--noinput']
          envFrom:
            - configMapRef:
                name: digiland-config
            - secretRef:
                name: digiland-secrets
      containers:
        - name: digiland-web
          image: ghcr.io/digiland/digiland:latest
          imagePullPolicy: Always
          command: ['/app/config/entrypoint.sh']
          args:
            - gunicorn
            - land_escrow.wsgi:application
            - --config
            - config/gunicorn.conf.py
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: digiland-config
            - secretRef:
                name: digiland-secrets
          livenessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: tmp
              mountPath: /app/tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: digiland-media-pvc
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: digiland
              component: web
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: digiland
                    component: web
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 120
