# =============================================================================
# SECURITY WARNING — Kubernetes Secrets Manifest
# =============================================================================
# This file contains PLACEHOLDER values and must NEVER be committed with real
# secrets. In production, use one of the following approaches instead:
#
# 1. SealedSecrets (recommended):
#    kubectl kustomize github.com/bitnami-labs/sealed-secrets
#    kubeseal --format yaml < secret.yaml > sealed-secret.yaml
#
# 2. External Secrets Operator (ESO):
#    Syncs from AWS Secrets Manager / HashiCorp Vault
#
# 3. CSI Secrets Store Driver:
#    Mounts secrets directly from cloud provider secret stores
#
# To encode a value: echo -n "your-secret" | base64
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: digiland-secrets
  namespace: digiland
  labels:
    app: digiland
    component: secrets
  annotations:
    # This annotation prevents ArgoCD/Flux from syncing this file directly
    # in favor of a SealedSecret or ExternalSecret
    argocd.argoproj.io/sync-options: SkipDryRunOnDelete=true
type: Opaque
data:
  # IMPORTANT: Replace these with actual base64-encoded values in production.
  # Do NOT commit real secrets to Git. Use kubeseal or External Secrets Operator.
  SECRET_KEY: "REPLACE_WITH_BASE64_ENCODED_SECRET_KEY"
  POSTGRES_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_DB_PASSWORD"
  REDIS_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_REDIS_PASSWORD"
  DATABASE_URL: "REPLACE_WITH_BASE64_ENCODED_DATABASE_URL"
  REDIS_URL: "REPLACE_WITH_BASE64_ENCODED_REDIS_URL"
  CELERY_BROKER_URL: "REPLACE_WITH_BASE64_ENCODED_CELERY_BROKER_URL"
  CELERY_RESULT_BACKEND: "REPLACE_WITH_BASE64_ENCODED_CELERY_RESULT_BACKEND"
  STRIPE_PUBLIC_KEY: "REPLACE_WITH_BASE64_ENCODED_STRIPE_PUBLIC_KEY"
  STRIPE_SECRET_KEY: "REPLACE_WITH_BASE64_ENCODED_STRIPE_SECRET_KEY"
  SENTRY_DSN: "REPLACE_WITH_BASE64_ENCODED_SENTRY_DSN"
  CLOUDINARY_URL: "REPLACE_WITH_BASE64_ENCODED_CLOUDINARY_URL"
  MPESA_CALLBACK_SECRET: "REPLACE_WITH_BASE64_ENCODED_MPESA_CALLBACK_SECRET"
