apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: digiland-ingress
  namespace: digiland
  labels:
    app: digiland
    component: ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/rate-limit: "60"
    nginx.ingress.kubernetes.io/limit-connections: "30"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "4k"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=(self)";
spec:
  ingressClassName: nginx
  tls:
    - secretName: digiland-tls
      hosts:
        - digiland.co.ke
        - www.digiland.co.ke
  rules:
    - host: digiland.co.ke
      http:
        paths:
          - path: /static/
            pathType: Prefix
            backend:
              service:
                name: digiland-web-service
                port:
                  number: 80
          - path: /media/
            pathType: Prefix
            backend:
              service:
                name: digiland-web-service
                port:
                  number: 80
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: digiland-web-service
                port:
                  number: 80
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: digiland-web-service
                port:
                  number: 80
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: digiland-web-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digiland-web-service
                port:
                  number: 80
    - host: www.digiland.co.ke
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: digiland-web-service
                port:
                  number: 80
