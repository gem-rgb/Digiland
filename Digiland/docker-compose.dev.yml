version: "3.9"

# Development overrides — use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  web:
    build:
      context: ./land_escrow
      dockerfile: config/Dockerfile
      target: builder
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./land_escrow:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - CELERY_TASK_ALWAYS_EAGER=True

  # Frontend dev server with hot reload
  frontend:
    build:
      context: ./land_escrow/client
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./land_escrow/client:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000

  # PostgreSQL exposed for debugging
  db:
    ports:
      - "5432:5432"

  # Redis exposed for debugging
  redis:
    ports:
      - "6379:6379"

  # pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: digiland-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@digiland.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - digiland-network

  # Celery Flower for task monitoring
  flower:
    build:
      context: ./land_escrow
      dockerfile: config/Dockerfile
    command: celery -A land_escrow flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://:redis_secret@redis:6379/1
    depends_on:
      - redis
    networks:
      - digiland-network
