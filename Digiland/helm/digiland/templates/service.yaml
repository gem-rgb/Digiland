apiVersion: v1
kind: Service
metadata:
  name: {{ include "digiland.fullname" . }}
  labels:
    {{- include "digiland.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "digiland.selectorLabels" . | nindent 4 }}
    app: {{ include "digiland.name" . }}
