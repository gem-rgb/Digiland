# =============================================================================
# Fly.io Auto-Scaling & Scale-to-Zero Configuration for Digiland
# =============================================================================
# Docs: https://fly.io/docs/reference/configuration/
#
# Cost Efficiency in Kenya:
#   - auto_stop_machines = true: Suspends VM when no traffic (0 cost)
#   - auto_start_machines = true: Wakes up instantly on HTTP request (~300ms)
#   - min_machines_running = 0: Zero idle cost
#   - Automatically spins up extra machines when traffic spikes
# =============================================================================

app = "digiland-app"
primary_region = "jnb" # Johannesburg (lowest latency to Kenya) or "fra" (Frankfurt)

[build]
  dockerfile = "land_escrow/config/Dockerfile"

[deploy]
  release_command = "python manage.py migrate --noinput"

[env]
  DJANGO_SETTINGS_MODULE = "land_escrow.settings_production"
  PORT = "8000"
  USE_REDIS_CACHE = "True"
  DB_DISABLE_SERVER_SIDE_CURSORS = "True"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 30
    hard_limit = 60

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
