{% extends 'frontend/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Upload & Register Land Parcel</h4>
            </div>
            <div class="card-body">
                <p class="text-muted mb-4">Provide details for the land parcel. Our system will automatically cross-reference these attributes with the ArdhiSasa registry during the "Pending" phase.</p>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3 btn-lg fw-bold">Submit for Verification</button>
                    <a href="{% url 'frontend:parcel_list' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
