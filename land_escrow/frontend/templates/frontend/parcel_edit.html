{% extends 'frontend/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4 border-0">
            <div class="card-header bg-dark text-white py-3">
                <h4 class="mb-0">Edit Land Parcel &mdash; {{ parcel.parcel_number }}</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">You can modify these details while the verification status is <span class="badge bg-warning text-dark">Pending</span> or <span class="badge bg-danger">Disputed</span>. Verification checks will restart after you save changes.</p>
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100 mt-3 btn-lg fw-bold">Save Changes</button>
                    <a href="{% url 'frontend:parcel_detail' parcel.parcel_number %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
